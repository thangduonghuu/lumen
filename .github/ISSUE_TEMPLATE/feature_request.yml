name: Feature request
description: Suggest new tool coverage, a behavior change, or something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or annoying?
      description: What can't you do today, or what's clunky about the current behavior?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see instead?
      description: >
        If this is a new tool/subcommand table, name the tool and the
        subcommands/flags it should cover.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — any workarounds you're using today.
